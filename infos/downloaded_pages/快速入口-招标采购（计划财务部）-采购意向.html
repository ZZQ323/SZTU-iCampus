<script type="text/javascript">
	var type = ["ZCGG","ZCGS","FBGG"];
	$(document).ready(function() {
		 query();
	});
	function changeChoose(obj) {
		$(".siderBar").find("a").attr("class","default");
		$(obj).attr("class","active");
		var titletext = $(obj).text();
		$(".listbar").find(".title").find("span").text(titletext);
		query();
	}
	function query() {
		var titletext = $(".menu").find("a[class='active']").text();
		$(".listbar").find(".title").find("span").text(titletext);
		if(titletext == "合同公示"){
			$("#shopQueryDiv").hide();
			$("#catalogQueryDiv").hide();
			$("#endQueryDiv").hide();
		}else{
			$("#shopQueryDiv").show();
			$("#catalogQueryDiv").show();
			$("#endQueryDiv").show();
		}
		var typeDetail = $(".menu").find("a[class='active']").attr("data-dipid")?$(".menu").find("a[class='active']").attr("data-dipid").split(","):'';
		var data = {
			type : $(".menu").find("a[class='active']").attr("data-divid")?$(".menu").find("a[class='active']").attr("data-divid").split(","):'',
			shopType : $("#shop_type").val()!='all'?$("#shop_type").val().split(",") : null,
			catalog:$("#catalog").val(),
			isEnd:$("#is_end").val(),
			categoryId:$(".menu").find("a[class='active']").attr("data-cate") ?$(".menu").find("a[class='active']").attr("data-cate").split(",") : null
		};
		if (typeDetail == "GG") {
			data.categoryId="104910";
			data.sort = "beginTime desc";
			
			//ZCGS需要排除单一来源，在后台单独处理
			//data.type=["ZCGG","BGGG","FBGG"];
			data.ggType="GG";
		} else if(typeDetail == "XQ"){
			data.categoryId="104791";
			data.sort = "beginTime desc";
			
			data.ggType="XQ";
		}else if(typeDetail == "YX"){
			data.categoryId="103980";
			data.sort = "beginTime desc";
		}else if(typeDetail == "HT"){
			data.categoryId="104557";
			data.sort = "beginTime desc";
		}
		data.keywords = $("input[name='keywords']").val();
		var obj = $("#psmsdatalist")[0];
		obj.setExtendData(data);
		obj.refresh();
	}
	function paintList(content, record) {
		var c = $(content);
		if(record["subject"]){
			if (record["subject"].indexOf("中标候选人公示") != -1 
					&& record["tenderNo"]
					&& (record["subject"].indexOf(record["tenderNo"]) == -1  
						|| record["subject"].indexOf("["+record["tenderNo"]+"]") == -1)) {
				var subject = "["+ record["tenderNo"] + "]" + record["subject"];
				c.find("[subjectdetail='subjectdetail']").attr("title", subject);
				c.find("[subjectdetail='subjectdetail']").html(subject);
			}
			
			if(record["url"]){
				c.find("[subjectdetail='subjectdetail']").attr("href", record["url"]);
			}else{
				if(record["newType"] && record["newType"] == "1"){
					var cid = $(".menu").find("a[class='active']").attr("data-cate");
					c.find("[subjectdetail='subjectdetail']").attr("href", "e?page=cms.detail&cid="+record['catalog']+"&nextcid="+record['catalog']+"&aid="+record['id'] );
				}else if(record["type"] == "HTBG" || record["type"] == "HTGS"){
					c.find("[subjectdetail='subjectdetail']").attr("href", "e?page=cms.cgtext&id="+record["id"]);
          		}else{
					c.find("[subjectdetail='subjectdetail']").attr("onclick","showDetail(\""+showDetailTime(record)+"\",\""+record['syncId']+"\",\""+record['id']+"\");" );
				}
			}
		}
		if (record["beginTime"]) {
			if(type.indexOf(record.type)!=-1||record.createType=="1"||record.createType=="2"||(!record.edate)){
				c.find("[date='date']").attr("class","time over");
				c.find("[date='date']").text(ptime(record)+"发布");
			}else{
				if(record.isEnd==0){
					c.find("[date='date']").attr("class","time over");
					c.find("[date='date']").text(showTime(record)+"截止");
				}else{
					if(record["endTime"]){
						c.find("[date='date']").text(showTime(record)+"截止");
					}else{
						c.find("[date='date']").text(ptime(record)+"发布");
					}
					
				}
			}
		}
		return c[0].outerHTML;
	}
	function showDetail(type, publish_id,id) {
		window.open("/provider/#/publish/"+publish_id);
	}
	function showDetailTime(record){
		var pdate;
		if(record["beginTime"]){
			pdate = record["beginTime"];
		}else{
			pdate = record["syncTime"];
		}
		var  pYear=pdate.substring(0,4);
	    var  pMonth=pdate.substring(5,7);
	    var  pDay=pdate.substring(8,10);
	    var  ptime=pYear+"/"+pMonth+"/"+pDay+"/"; 
	    return ptime;
	}
	function ptime(record){
		var  pdate;
		if(record["beginTime"]){
			pdate = record["beginTime"];
		}else{
			pdate = record["syncTime"];
		}
		var  pYear=pdate.substring(0,4);
	    var  pMonth=pdate.substring(5,7);
	    var  pDay=pdate.substring(8,10);
	    var  ptime=pYear+"年"+pMonth+"月"+pDay+"日"; 
	    return ptime;
	}
	function showTime(record){
		var edate=record["endTime"];
	    var  year=edate.substring(0,4);
	    var  month=edate.substring(5,7);
	    var  day=edate.substring(8,10);
	    var  minutes=edate.substring(11,13);
		var  seconds=edate.substring(14,16);
		var showTime=year+"年"+month+"月"+day+"日  "+minutes+"时"+seconds+"分";
		return showTime;
	}
</script>
