// module-common
plugins {
    id 'java-library'  // ← 添加这行（java-library 包含 java 功能）
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

//repositories {
//    // 核心：Maven中央仓库（必填）
//    mavenCentral()
//
//    // 可选：国内阿里云镜像（加速依赖下载）
//    maven { url 'https://maven.aliyun.com/repository/public/' }
//}

dependencies {
    implementation 'org.apache.dubbo:dubbo:3.2.0'
    implementation("com.github.binarywang:weixin-java-miniapp:4.7.0")
    implementation 'com.alibaba.fastjson2:fastjson2:2.0.48'
    // 业务模块不需要 Spring Boot 插件，只需要基础依赖
    implementation 'org.springframework:spring-core'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.security:spring-security-core'
    // RedisTemplate 是 Spring Data Redis 框架的核心类
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Apache HttpClient 5.x
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.3.1'

    // Apache Commons Pool2（对象池核心）
    implementation 'org.apache.commons:commons-pool2:2.12.0'
    implementation 'net.sourceforge.tess4j:tess4j:5.8.0'

    // JWT 依赖（common模块需要提供JWT工具类）
    api "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // 如果JwtAuthFilter是Filter，可能还需要Servlet API
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
}
