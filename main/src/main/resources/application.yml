server:
  port: 8080
  tomcat:
    connection-timeout: 10000
program:
  name: sztu
  code: 10001

##服务监控
management:
  endpoints:
    web:
      exposure:
        include: 'loggers,health,prometheus'
middleware:
  redis: ${dev.localhost}
#  rocketmq: "192.168.18.79"
#  kafka: "192.168.1.132"
#  nacos: "192.168.18.79"
#  edge: "192.168.1.63"

spring:
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
  profiles:
    active: dev
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  data:
    ##redis
    redis:
      host: ${middleware.redis}
      port: 6379
      password: ${passwd.redis}
      database: 0

