server:
  port: 8080
  tomcat:
    connection-timeout: 10000




program:
  name: sztu
  code: 10001

##服务监控
management:
  endpoints:
    web:
      exposure:
        include: 'loggers,health,prometheus'
middleware:
  redis: ${dev.localhost}
# 异步消息队列1
#  rocketmq: "192.168.18.79"
# 异步消息队列2
#  kafka: "192.168.1.132"
# 服务发现与查找
#  nacos: "192.168.18.79"
# 物联网服务
#  edge: "192.168.1.63"

spring:
  # 调度线程池：AnnouncementFastScheduler(10s) + SourceCrawlScheduler(60s) 并行
  task:
    scheduling:
      pool:
        size: 3
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
  profiles:
    active: dev
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  data:
    ##redis
    redis:
      host: ${middleware.redis}
      port: 6379
      password: ${passwd.redis}
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 20 # 最大连接数
          max-idle: 10 # 最大空闲连接
          min-idle: 5  # 最小空闲连接
          max-wait: -1ms # 获取连接的最大等待时间
    # 定时任务配置
    # @EnableScheduling 已在 SchedulePushTask 中启用
    # 如果需要配置线程池，可以添加:
    task:
      scheduling:
        pool:
          size: 2  # 定时任务线程池大小
        thread-name-prefix: schedule-task-


# 日志配置 (可选，用于调试)
logging:
  level:
    cn.edu.sztui.common.util.smarthttp: INFO
    cn.edu.sztui.base.application.service.impl.cn.edu.sztui.base.application.service.impl.AuthServiceImpl: INFO
    cn.edu.sztui.base.infrastructure.sse: INFO
    cn.edu.sztui.base.infrastructure.stream: INFO
    cn.edu.sztui.base.infrastructure.scheduler: INFO
    # Playwright 相关日志
    # cn.edu.sztui.base.domain.model.proxy.browser: INFO
    # cn.edu.sztui.base.domain.model.proxy.session: INFO
    # cn.edu.sztui.base.domain.model.proxy.login: DEBUG

    # 应用层日志
    cn.edu.sztui.base.application.service: INFO

    # 连接池日志
    org.apache.commons.pool2: WARN

    # Playwright 内部日志（调试时可开启）
    com.microsoft.playwright: WARN

# ==================== 会话缓存配置 ====================

proxy:
  session:
    # 设备初始化会话过期时间（秒）
    # 仅用于登录流程，建议 30 分钟
    device-init-expire: 1800

    # 用户登录会话过期时间（秒）
    # 建议 7 天，可根据需求调整
    user-session-expire: 604800

    # 设备账号列表过期时间（秒）
    # 建议 30 天
    device-accounts-expire: 2592000


