smart-http:
  # 默认超时（秒）- 普通接口
  timeout-seconds: 30
  # 慢请求超时（秒）- 登录等耗时操作
  slow-timeout-seconds: 90
  # 最大连接数
  max-connections: 500
  # 每个路由最大连接数
  max-connections-per-route: 100
  # User-Agent
  user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:148.0) Gecko/20100101 Firefox/148.0"

crawler:
  # 启动时是否强制重爬所有源（默认 false：增量模式，只爬 initialized=false 的源）
  # 需要全量重跑时在命令行加：--crawler.force-reinit=true
  # 或临时改成 true 启动一次、再改回 false
  force-reinit: false

# ==================== AI（活动抽取） ====================
# 真实 API Key 不在这里，写在 application-dev.yml（git 已忽略），
# 或走环境变量 DASHSCOPE_API_KEY
ai:
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-turbo              # 便宜优先；活动抽取轻量足够，要换 plus/deepseek 改这里
    timeout-seconds: 30
  activity:
    enabled: false                  # 总开关；Step A 默认关，通过 /admin 手动触发
    default-channels:
      - announcement                # 活动大概率在公文通，默认只扫这一个
    max-scan-count: 50              # 单次扫描硬上限，防手滑
    content-max-chars: 4000         # 正文超长截断，控成本
    cache-version: v1               # prompt / schema 改动时 bump，让旧缓存自然失效

sztu:
  constant:
    projectOrBrandName: ${program.name}
    projectOrBrandCode: ${program.code}
    projectName: ${program.name}
    environment: ${spring.profiles.active}
