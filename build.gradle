// ============================================================
// SZTU-iCampus 根 build.gradle
// 变更：sourceCompatibility / targetCompatibility 17 → 21
// ============================================================

plugins {
    id 'org.springframework.boot' version '3.3.1' apply false
    id 'io.spring.dependency-management' version '1.1.5' apply false
}

ext {
    lombokVersion = '1.18.34'
    commonsLang3Version = '3.14.0'
    hutoolVersion = '5.8.23'
    fastjson2Version = '2.0.48'
    jjwtVersion = '0.11.5'
    xxlJobVersion = '2.4.0'
    httpClientVersion = '4.5.14'
    httpCoreVersion = '4.4.16'
    jedisVersion = '5.0.0'
}

allprojects {
    group = 'cn.edu.sztui'
    version = '1.0.0'
    repositories {
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/public/' }
        maven { url 'https://maven.aliyun.com/repository/spring/' }
        maven { url 'https://repo.spring.io/release/' }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    // ★ JDK 17 → 21
    sourceCompatibility = '21'
    targetCompatibility = '21'

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    configurations.all {
        resolutionStrategy {
            force "org.apache.httpcomponents:httpclient:${httpClientVersion}"
            force "org.apache.httpcomponents:httpcore:${httpCoreVersion}"
            force "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
            force "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
            force "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
        }
    }

    dependencies {
        compileOnly "org.projectlombok:lombok:${lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
        testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
        testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

        implementation 'org.springframework.boot:spring-boot-starter'

        implementation "cn.hutool:hutool-all:${hutoolVersion}"
        implementation "org.apache.commons:commons-lang3:${commonsLang3Version}"

        implementation "com.alibaba.fastjson2:fastjson2:${fastjson2Version}"

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation platform('org.junit:junit-bom:5.10.0')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'org.mockito:mockito-core:5.5.0'
        testImplementation 'org.mockito:mockito-junit-jupiter:5.5.0'

        implementation 'org.springframework.boot:spring-boot-starter-data-redis'
        implementation 'org.jsoup:jsoup:1.17.2'
        implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
    }

    test {
        useJUnitPlatform()
        testLogging {
            events 'PASSED', 'FAILED', 'SKIPPED'
            showStandardStreams = false
        }
    }
}
