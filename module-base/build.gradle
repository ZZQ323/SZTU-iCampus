plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    // jsoup 解析文档
    implementation 'org.jsoup:jsoup:1.17.2'

    implementation("com.github.binarywang:weixin-java-miniapp:4.7.0")

    // 业务模块不需要 Spring Boot 插件，只需要基础依赖
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    // implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // 定时任务（如果用Spring Scheduler就不需要xxl-job）
    // implementation "com.xuxueli:xxl-job-core:${xxlJobVersion}"
    // WebSocket
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    // Playwright（浏览器自动化）
    implementation 'com.microsoft.playwright:playwright:1.43.0'
    // Apache Commons Pool2（对象池核心）
    implementation 'org.apache.commons:commons-pool2:2.12.0'
    implementation 'net.sourceforge.tess4j:tess4j:5.8.0'

    //  依赖公共包
    implementation project(':module-common')
}
