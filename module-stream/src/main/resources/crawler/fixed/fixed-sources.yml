# 数据源配置：公文通（WebVPN，需要登录）
# parserType: sztu-gwt
# 列表格式：list.jsp?wbtreeid=XXXX 表格式

sources:

  - id: gwt-jiaowu
    name: 教务公告
    channelId: announcement
    parserType: sztu-gwt
    baseUrl: ${urls.gwt}
    listUrlTemplate: ${urls.gwt}/list.jsp?urltype=tree.TreeTempUrl&wbtreeid=1018&a1020514p={page}&a1020514c=20
    detailUrlTemplate: ${urls.gwt}/info/1018/{id}.htm
    categoryCode: "1018"
    categoryName: 教务
    contentType: notice
    subContentType: general-notice
    requiresAuth: true
    crawlIntervalMinutes: 1
    # crawlPageCount: 1
    enabled: true
    sort: 1

