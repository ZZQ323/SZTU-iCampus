  # ========================================================================

  - id: jw-jdt
    name: 教学动态
    channelId: academic
    parserType: sztu-cms
    baseUrl: ${urls.znbm.jw}
    listUrl: ${urls.znbm.jw}/jdt.htm
    detailUrlTemplate: ${urls.znbm.jw}/info/{category}/{id}.htm
