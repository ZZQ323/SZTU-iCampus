  #  列表格式：list.jsp?wbtreeid=XXXX 表格式
  # ========================================================================

  - id: gwt-jiaowu
    name: 教务公告
    channelId: announcement
    parserType: sztu-gwt
    baseUrl: https://nbw-sztu-edu-cn-s.webvpn.sztu.edu.cn:8118
    listUrlTemplate: https://nbw-sztu-edu-cn-s.webvpn.sztu.edu.cn:8118/list.jsp?urltype=tree.TreeTempUrl&wbtreeid=1018&a1020514p={page}&a1020514c=20
    detailUrlTemplate: https://nbw-sztu-edu-cn-s.webvpn.sztu.edu.cn:8118/info/1018/{id}.htm
    categoryCode: "1018"
    categoryName: 教务
    requiresAuth: true
    crawlIntervalMinutes: 10
    # crawlPageCount: 1
    enabled: true
    sort: 1

