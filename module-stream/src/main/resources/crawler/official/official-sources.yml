# 数据源配置：学校官网（www.sztu.edu.cn，公开，不需要登录）
# parserType: sztu-cms
# 列表格式：卡片式 li[id^=line_] 或 li > a

sources:

  # ---------- 活力技大 ----------

  - id: www-wyhd
    name: 文娱活动
    channelId: campus-life
    parserType: sztu-cms
    baseUrl: ${urls.www}
    listUrl: ${urls.www}/hljd/xyhd/wyhd.htm
    detailUrlTemplate: ${urls.www}/info/{category}/{id}.htm
    categoryCode: "1040"
    categoryName: 文娱活动
    contentType: news
    subContentType: student
    requiresAuth: false
    crawlIntervalMinutes: 60
    # crawlPageCount: 1
    enabled: true
    sort: 1

  - id: www-tyhd
    name: 体育活动
    channelId: campus-life
    parserType: sztu-cms
    baseUrl: ${urls.www}
    listUrl: ${urls.www}/hljd/xyhd/tyhd.htm
    detailUrlTemplate: ${urls.www}/info/{category}/{id}.htm
    categoryCode: "1041"
    categoryName: 体育活动
    contentType: news
    subContentType: student
    # 本页混合了 1041/1088/1087/1067/1015 五个分类，但用户反馈只有 info/1041 可
    # 公开访问，其他走 tusports.sztu.edu.cn 会 404。用白名单只保留 1041。
    categoryWhitelist: "1041"
    requiresAuth: false
    crawlIntervalMinutes: 60
    # crawlPageCount: 1
    enabled: true
    sort: 2

  - id: www-jdfg
    name: 技大风光
    channelId: campus-life
    parserType: sztu-cms
    baseUrl: ${urls.www}
    listUrl: ${urls.www}/hljd/jdfg.htm
    detailUrlTemplate: ${urls.www}/info/{category}/{id}.htm
    categoryCode: "1037"
    categoryName: 技大风光
    contentType: news
    subContentType: general-news
    requiresAuth: false
    crawlIntervalMinutes: 120
    # crawlPageCount: 1
    # ⚠️ 纯图片画廊，文章标题 display:none，爬取价值不大，先关闭
    enabled: true
    sort: 3

  # ---------- 媒体焦点 ----------

  - id: www-xyxw
    name: 校园新闻
    channelId: news
    parserType: sztu-cms
    baseUrl: ${urls.www}
    listUrl: ${urls.www}/jdjd/xyxw.htm
    detailUrlTemplate: ${urls.www}/info/{category}/{id}.htm
    categoryCode: "1003"
    categoryName: 校园新闻
    contentType: news
    subContentType: general-news
    requiresAuth: false
    crawlIntervalMinutes: 60
    # crawlPageCount: 1
    enabled: true
    sort: 1

  - id: www-mtjj
    name: 媒体聚焦
    channelId: news
    parserType: sztu-cms
    baseUrl: ${urls.www}
    listUrl: ${urls.www}/jdjd/mtjj.htm
    detailUrlTemplate: ${urls.www}/info/{category}/{id}.htm
    requiresAuth: false
    crawlIntervalMinutes: 120
    # crawlPageCount: 1
    # ⚠️ 100% 外部链接（深圳特区报/新华社/南方Plus/科技日报），
    #    无 info/ 链接，无法爬取详情，仅存元数据+外链 URL。
    #    前端展示为"外部链接"标签，点击复制链接或 web-view 打开。
    enabled: true
    sort: 2

  # ---------- 对外交流 ----------

  - id: www-gjjl
