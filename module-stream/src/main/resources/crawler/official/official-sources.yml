    contentType: news
    subContentType: cooperation
    requiresAuth: false
    crawlIntervalMinutes: 120
    # crawlPageCount: 1
    enabled: true
    sort: 3

  - id: www-xsjwjl
    name: 学生境外交流
    channelId: news
