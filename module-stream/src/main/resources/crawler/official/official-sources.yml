    contentType: news
    subContentType: cooperation
    requiresAuth: false
    crawlIntervalMinutes: 120
    # crawlPageCount: 1
    enabled: true
    sort: 4

  # ---------- 官网科研板块 ----------

  - id: www-xqhz
